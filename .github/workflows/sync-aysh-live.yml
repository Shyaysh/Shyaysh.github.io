name: Sync AYSH live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync AYSH live files
        run: |
          cp aysh-services-live.html aysh-services.html
          mkdir -p aysh
          cp aysh-services-live.html aysh/index.html
          git rm aysh-services-live.html
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync AYSH Services live visitors counter"
            git push
          fi
