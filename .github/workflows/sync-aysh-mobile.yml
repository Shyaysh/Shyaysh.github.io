name: Sync AYSH mobile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync mobile file to live pages
        run: |
          cp aysh-services-mobile.html aysh-services.html
          mkdir -p aysh
          cp aysh-services-mobile.html aysh/index.html
          git rm aysh-services-mobile.html
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync AYSH Services mobile view to aysh-services.html and aysh/index.html"
            git push
          fi
