name: Publish site as index.html
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore sample website as index.html
        run: |
          git config user.name "Shyaysh"
          git config user.email "shyaysh@users.noreply.github.com"
          BEFORE_RENAME=$(git log --diff-filter=D --format=%H -1 -- sample-website.html)
          git checkout "$BEFORE_RENAME^" -- sample-website.html
          rm -f index.html
          mv sample-website.html index.html
          git add -A
          git commit -m "Publish sample website as index.html" || echo "nothing to commit"
          git push
